[package]
name = "scx_rustgame"
version = "1.1.4"
authors = ["Erikas <erikmnkl@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "A sched_ext scheduler that prioritizes the frame path of one game (Rust by default). https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
libbpf-rs = "=0.27.2"
log = "0.4"
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }
